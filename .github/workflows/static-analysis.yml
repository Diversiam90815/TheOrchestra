name: Static Analysis

on:
  push:
  pull_request:

jobs:
  cppcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck ninja-build libnl-genl-3-dev libnl-3-dev

      - name: Configure and build (with CppCheck enabled)
        run: |
          cmake -S . -B build -G Ninja -DENABLE_CPPCHECK=ON -DENABLE_FORMAT=OFF -DENABLE_DOXYGEN=OFF
          cmake --build build
