name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - uses: lukka/get-cmake@latest

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Ninja
        run: pip install ninja

      - name: Install libnl (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnl-genl-3-dev libnl-3-dev

      - name: Configure, build and run tests
        run: python build.py --prepare --runtest True
